<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cooking Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="local">
    <div class="container">
        <header>
            <div class="banner">
                <img src="assets/banner.svg" alt="Food recipes banner">
            </div>
        </header>

        <div class="action-section">
            <button id="addRecipeBtn" class="btn btn-primary">+ Add Recipe</button>
            <button id="importRecipeBtn" class="btn btn-secondary">Import Shared Recipe</button>
            <a href="shared.html" class="btn btn-secondary">View Imported Recipes</a>
        </div>

        <div class="search-section">
            <div class="search-main">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-bar" 
                    placeholder="Search recipes by name or ingredients..."
                >
            </div>

            <aside class="filter-sidebar">
                <div class="filter-header">Filters</div>
                <div class="filter-controls">
                    <div class="filter-group">
                        <label for="vegetarianFilter">Diet Type:</label>
                        <select id="vegetarianFilter" class="filter-select">
                            <option value="">All Recipes</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="non-vegetarian">Non-Vegetarian</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="dishTypeFilter">Dish Type:</label>
                        <select id="dishTypeFilter" class="filter-select">
                            <option value="">All Types</option>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                            <option value="dessert">Dessert</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
            </aside>
        </div>

        <div id="recipesList" class="recipes-grid">
            <p class="empty-state">No recipes yet. Add one to get started!</p>
        </div>
    </div>

    <!-- Add Recipe Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Recipe</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="recipeForm">
                <div id="formError" class="form-error" aria-live="assertive"></div>
                <div class="form-group">
                    <label for="recipeName">Recipe Name *</label>
                    <input type="text" id="recipeName" required>
                </div>

                <div class="form-group">
                    <label for="ingredients">Ingredients *</label>
                    <textarea id="ingredients" placeholder="Enter ingredients (one per line)" required></textarea>
                </div>

                <div class="form-group">
                    <label for="instructions">Instructions *</label>
                    <textarea id="instructions" placeholder="Enter cooking instructions" required></textarea>
                </div>

                <div class="form-group">
                    <label for="dishType">Dish Type</label>
                    <select id="dishType">
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="snack">Snack</option>
                        <option value="dessert">Dessert</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recipePhoto">Recipe Photo</label>
                    <input type="file" id="recipePhoto" accept="image/*">
                    <button type="button" class="btn btn-secondary" id="generatePhotoBtn">Get Photo for Me</button>
                    <div id="photoPreview" class="photo-preview"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prepTime">Prep Time (minutes)</label>
                        <input type="number" id="prepTime" min="0">
                    </div>
                    <div class="form-group">
                        <label for="cookTime">Cook Time (minutes)</label>
                        <input type="number" id="cookTime" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="servings">Servings</label>
                    <input type="number" id="servings" min="1" value="4">
                </div>

                <div class="form-group checkbox-group">
                    <label for="vegetarian">
                        <input type="checkbox" id="vegetarian">
                        Vegetarian recipe
                    </label>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty Level</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Import Recipe Modal -->
    <div id="importModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Import Shared Recipe</h2>
                <button class="close-btn" id="closeImportBtn">&times;</button>
            </div>
            <div class="form-group">
                <label for="importText">Paste the shared recipe text below</label>
                <textarea id="importText" placeholder="Recipe: ...\nType: ...\nDifficulty: ...\nIngredients:\n- ..." rows="10"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelImportBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="importRecipeSubmitBtn">Import Recipe</button>
            </div>
        </div>
    </div>

    <!-- Recipe Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="detailTitle"></h2>
                <button class="close-btn" id="closeDetailBtn">&times;</button>
            </div>
            <div id="detailContent" class="detail-content"></div>
            <div class="detail-actions">
                <button class="btn btn-secondary" id="editRecipeBtn">Edit</button>
                <button class="btn btn-secondary" id="shareRecipeBtn">Share</button>
                <button class="btn btn-danger" id="deleteRecipeBtn">Delete</button>
                <button class="btn btn-secondary" id="closeDetailBtnBottom">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
